services:
  server:
    build: ./server
    ports:
      - "5050:5050"
    volumes:
      - ./server-config/config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: ../docker/client.Dockerfile
    depends_on:
      - server
    stdin_open: true
    tty: true
    profiles: ["client"]
