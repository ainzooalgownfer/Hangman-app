services:
  server:
    build: ./server
    ports:
      - "5050:5050"
    volumes:
      - ./server-config/config.yaml:/app/config.yaml:ro
      - ./certs:/app/certs:ro # made by ./play.sh certs
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: ../docker/client.Dockerfile
    depends_on:
      - server
    volumes:
      - ./certs/server.crt:/app/server.crt:ro
    command: ["server", "5050", "--tls"]
    stdin_open: true
    tty: true
    profiles: ["client"]
